name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Rebuild, then check the manifest, syntax colors and contrast
      - run: npm run check
      # The build must reproduce the committed themes exactly
      - run: git diff --exit-code
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
